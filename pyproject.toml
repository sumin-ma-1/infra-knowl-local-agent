[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-knowl-local-agent"
version = "0.1.0"
description = "Local LLM Infrastructure Knowledge Agent — structured inventory tools, not naive RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.6",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
infra-agent = "infra_agent.cli:main"
infra-agent-telegram = "infra_agent.telegram_bot:main"
infra-agent-telegram-index = "infra_agent.telegram_index.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infra_agent = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
